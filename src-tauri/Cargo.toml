[package]
name = "pharmasim"
version = "0.1.0"
description = "PharmaSim — 3D pharmacy business simulator"
edition = "2021"

[lib]
name = "pharmasim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
